# GRPO from the merged SFT model with rewards from executing hidden tests.
# Prompts are restricted to problems the SFT policy sometimes (but not always) solves:
#   posttrain eval configs/eval/rollouts_kodcode_train.yaml model.name_or_path=runs/sft/<run>/merged
#   posttrain filter-difficulty --samples runs/eval/<rollouts>/samples.jsonl \
#     --output data/tasks/grpo_learnable.txt
# Ablations: reward.correctness=fraction, trainer.beta=0.04 (KL), trainer.loss_type=grpo.
run_name: grpo-kodcode-lora
seed: 42
model:
  name_or_path: REPLACE_WITH_MERGED_SFT_MODEL
  dtype: bfloat16
lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
data:
  dataset: kodcode
  split: train
  task_ids_file: data/tasks/grpo_learnable.txt
reward:
  correctness: binary
execution:
  timeout_s: 30
  per_test_timeout_s: 10
  memory_mb: 4096
  max_workers: 8
trainer:
  # Rollouts with vLLM inside the training process; it sleeps (frees memory) during optimizer
  # steps. Set use_vllm=false to generate with model.generate() for a throughput comparison.
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.35
  vllm_enable_sleep_mode: true
  vllm_max_model_length: 2048
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  max_completion_length: 768
  temperature: 1.0
  loss_type: dapo
  scale_rewards: group
  epsilon: 0.2
  mask_truncated_completions: true
  beta: 0.0
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 0.03
  max_steps: 300
  reward_weights: [1.0, 0.1]
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  log_completions: false
  save_steps: 50
  save_total_limit: 2
  report_to: none
