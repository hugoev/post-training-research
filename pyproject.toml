[project]
name = "posttrain"
version = "0.1.0"
description = "Post-training (SFT, DPO, GRPO) and executable evaluation for code LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "pandas>=2.0",
    # Imported by pytest-style benchmark tests (e.g. KodCode's pytest.raises) in the sandbox.
    "pytest>=8.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "transformers>=4.51",
    "trl>=0.20",
    "peft>=0.15",
    "accelerate>=1.5",
    "bitsandbytes>=0.45",
]
vllm = ["vllm>=0.8"]

[dependency-groups]
dev = ["ruff>=0.6"]

[project.scripts]
posttrain = "posttrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
